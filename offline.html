<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesabaChat - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0ebe4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .offline-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        
        .offline-icon {
            font-size: 72px;
            display: block;
            margin-bottom: 16px;
        }
        
        .offline-card h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        
        .offline-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .offline-card .btn-retry {
            background: #ff6b4a;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .offline-card .btn-retry:hover {
            background: #e85a3a;
            transform: scale(0.97);
        }
        
        .offline-card .features {
            margin: 20px 0;
            padding: 16px;
            background: #f8f5f0;
            border-radius: 12px;
            text-align: left;
        }
        
        .offline-card .features li {
            list-style: none;
            padding: 6px 0;
            font-size: 13px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .offline-card .features li:before {
            content: "✅";
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <span class="offline-icon">🌐</span>
        <h1>Sem Conexão</h1>
        <p>Parece que estás offline. Não te preocupes, o DesabaChat funciona mesmo sem internet!</p>
        
        <div class="features">
            <li>Visualizar posts já carregados</li>
            <li>Escrever rascunhos</li>
            <li>Posts serão publicados quando voltares online</li>
        </div>
        
        <button class="btn-retry" onclick="location.reload()">
            🔄 Tentar novamente
        </button>
        
        <p style="margin-top:16px;font-size:12px;color:#999;">
            <a href="./" style="color:#ff6b4a;text-decoration:none;font-weight:600;">← Voltar para o app</a>
        </p>
    </div>
</body>
</html>
