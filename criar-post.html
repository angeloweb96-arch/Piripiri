<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piripiri Chat - Nova Publicação</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="post.js"></script>
    
    <style>
        .post-form {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-top: 16px;
            border: 1px solid var(--border-color);
        }
        
        .post-form textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            resize: vertical;
            transition: var(--transition);
        }
        
        .post-form textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
            outline: none;
        }
        
        .form-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0;
        }
        
        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        .form-options input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        
        .form-options select {
            padding: 6px 12px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }
        
        .image-upload {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin: 12px 0;
        }
        
        .image-upload:hover {
            border-color: var(--primary);
            background: var(--bg-tertiary);
        }
        
        .image-upload img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 8px;
        }
        
        .image-preview {
            position: relative;
            display: inline-block;
        }
        
        .image-preview .remove-image {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .character-count {
            text-align: right;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 4px;
        }
        
        .character-count.limit {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='index.html'">
                <img src="icons/logo.svg" alt="Piripiri Chat" class="logo-img">
                <span class="logo-text">Nova Publicação</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="Alternar tema">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="icon-btn" onclick="window.location.href='index.html'">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </header>
    
    <div class="container main-content">
        <div class="post-form">
            <form id="createPostForm" onsubmit="handleCreatePost(event)">
                <div class="form-group">
                    <label>O que queres partilhar?</label>
                    <textarea id="postContent" placeholder="Escreve aqui o teu desabafo, segredo ou fofoca..." 
                              maxlength="1000" oninput="updateCharCount()"></textarea>
                    <div class="character-count" id="charCount">0 / 1000</div>
                </div>
                
                <div class="form-options">
                    <label>
                        <select id="postCategory">
                            <option value="desabafos">💭 Desabafo</option>
                            <option value="segredos">🔒 Segredo</option>
                            <option value="fofocas">🗣️ Fofoca</option>
                            <option value="diversos">🎯 Diversos</option>
                        </select>
                    </label>
                    
                    <label>
                        <input type="checkbox" id="isAdult">
                        🔞 Conteúdo Adulto
                    </label>
                    
                    <label>
                        <input type="checkbox" id="isAnonymous" checked>
                        🕵️ Publicar Anónimo
                    </label>
                </div>
                
                <div class="image-upload" onclick="document.getElementById('imageInput').click()">
                    <i class="fas fa-image" style="font-size:2rem;color:var(--text-light);"></i>
                    <p style="margin-top:4px;color:var(--text-light);font-size:0.85rem;">
                        Clique para adicionar uma imagem
                    </p>
                    <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                    <div id="imagePreview"></div>
                </div>
                
                <div style="display:flex;gap:12px;margin-top:16px;">
                    <button type="submit" class="btn-primary" style="flex:1;">
                        <i class="fas fa-paper-plane"></i> Publicar
                    </button>
                    <button type="button" class="btn-primary" style="flex:0;background:var(--bg-tertiary);color:var(--text-secondary);"
                            onclick="window.location.href='index.html'">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="toastContainer"></div>
    
    <script>
        let selectedImage = null;
        let isSubmitting = false;
        
        function updateCharCount() {
            const textarea = document.getElementById('postContent');
            const count = document.getElementById('charCount');
            const length = textarea.value.length;
            count.textContent = `${length} / 1000`;
            count.classList.toggle('limit', length > 900);
        }
        
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > CONFIG.MAX_IMAGE_SIZE) {
                showToast('A imagem é muito grande (máx. 5MB)', 'error');
                return;
            }
            
            if (!CONFIG.ALLOWED_IMAGE_TYPES.includes(file.type)) {
                showToast('Formato de imagem não suportado', 'error');
                return;
            }
            
            selectedImage = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = `
                    <div class="image-preview">
                        <img src="${e.target.result}" alt="Preview">
                        <button class="remove-image" onclick="removeImage()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            };
            reader.readAsDataURL(file);
        }
        
        function removeImage() {
            selectedImage = null;
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('imageInput').value = '';
        }
        
        async function handleCreatePost(e) {
            e.preventDefault();
            
            if (isSubmitting) return;
            
            const content = document.getElementById('postContent').value.trim();
            if (!content) {
                showToast('Escreve algo para publicar', 'warning');
                return;
            }
            
            isSubmitting = true;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> A publicar...';
            
            try {
                const postData = {
                    content: content,
                    category: document.getElementById('postCategory').value,
                    is_adult: document.getElementById('isAdult').checked,
                    is_anonymous: document.getElementById('isAnonymous').checked,
                    user_id: currentUser.id,
                    created_at: new Date().toISOString()
                };
                
                // Upload de imagem se existir
                if (selectedImage) {
                    const imageUrl = await uploadPostImage(selectedImage);
                    if (imageUrl) {
                        postData.image_url = imageUrl;
                    }
                }
                
                const { data, error } = await supabase
                    .from('posts')
                    .insert(postData)
                    .select()
                    .single();
                
                if (error) throw error;
                
                showToast('Publicação criada com sucesso! 🎉', 'success');
                window.location.href = 'index.html';
                
            } catch (error) {
                console.error('Erro ao criar publicação:', error);
                showToast('Erro ao criar publicação', 'error');
            } finally {
                isSubmitting = false;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Publicar';
            }
        }
        
        async function uploadPostImage(file) {
            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `${currentUser.id}/${Date.now()}.${fileExt}`;
                
                const { error: uploadError } = await supabase.storage
                    .from('posts')
                    .upload(fileName, file);
                
                if (uploadError) throw uploadError;
                
                const { data: { publicUrl } } = supabase.storage
                    .from('posts')
                    .getPublicUrl(fileName);
                
                return publicUrl;
            } catch (error) {
                console.error('Erro ao fazer upload da imagem:', error);
                showToast('Erro ao fazer upload da imagem', 'error');
                return null;
            }
        }
        
        // Aplicar tema
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('piripiri_theme') === 'dark') {
                document.body.classList.add('dark');
            }
        });
    </script>
</body>
</html>
